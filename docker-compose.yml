# The new Kebo stack: API + worker + web, PostgreSQL, MinIO files, nightly backups.
# Made to share a server with other apps (and with the old kebo-rfq stack during the switch):
#   - every name is prefixed "kebo-desk" (COMPOSE_PROJECT_NAME)
#   - only the web and the API join the shared proxy network; nothing else is reachable from outside
#
#   docker compose up -d --build
#   docker compose exec api sh -c "cd packages/database && npx tsx scripts/seed.ts"     # starting accounts (fresh install only — not when importing)
# See docs/switch-over.md.

name: ${COMPOSE_PROJECT_NAME:-kebo-desk}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgres://kebo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kebo
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (keep the old app's value so two-step sign-in keeps working)}
  APP_URL: ${APP_URL:?set APP_URL in .env}
  APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-kebo-files}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kebo}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  PUBLIC_FORM_ORIGINS: ${PUBLIC_FORM_ORIGINS:-https://keboint.com,https://www.keboint.com}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  PUBLIC_INQUIRIES_PER_HOUR: ${PUBLIC_INQUIRIES_PER_HOUR:-40}
  FCM_SERVICE_ACCOUNT_FILE: /app/secrets/firebase.json
  # Companies (see docs/companies.md): the company of old sessions and the website form,
  # where client inquiries are emailed, whether self sign-up is open.
  DEFAULT_COMPANY: ${DEFAULT_COMPANY:-}
  BASE_DOMAIN: ${BASE_DOMAIN:-}
  PLATFORM_EMAIL: ${PLATFORM_EMAIL:-}
  SIGN_UP_OPEN: ${SIGN_UP_OPEN:-false}
  COMPANY_POOL_SIZE: ${COMPANY_POOL_SIZE:-4}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kebo
      POSTGRES_USER: kebo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kebo -d kebo"], interval: 10s, timeout: 5s, retries: 10 }
    mem_limit: ${DB_MEMORY:-512m}
    logging: *logging

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kebo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [files:/data]
    expose: ["9000"]
    mem_limit: ${MINIO_MEMORY:-512m}
    logging: *logging

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: kebo-desk-api:${APP_VERSION:-latest}
    restart: unless-stopped
    environment: *server-env
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["${API_BIND:-127.0.0.1}:${API_HOST_PORT:-3421}:4000"]
    volumes: [./secrets:/app/secrets:ro]
    mem_limit: ${API_MEMORY:-768m}
    logging: *logging

  worker:
    image: kebo-desk-api:${APP_VERSION:-latest}
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      <<: *server-env
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
      # The backup's and the disk's status (written by docker/backup.sh and deploy/server/docker-cleanup.sh):
      # the worker emails the platform admins when a backup is old or failed, or the disk is full.
      SERVER_STATUS_DIR: /server-status
    volumes: [./secrets:/app/secrets:ro, ./backups/status:/server-status:ro]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    mem_limit: ${WORKER_MEMORY:-384m}
    logging: *logging

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: kebo-desk-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000/api
      DEMO_MODE: ${DEMO_MODE:-}
      APP_URL: ${APP_URL}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Addresses per company (docs/companies.md): empty = one address for everything.
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      ROOT_COMPANY: ${ROOT_COMPANY:-}
    depends_on:
      api: { condition: service_healthy }
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3420}:3000"]
    mem_limit: ${WEB_MEMORY:-1024m}
    logging: *logging

  backup:
    # PostgreSQL's tools and rclone (the off-site copy); docker/backup.sh says what it does.
    build: { context: docker, dockerfile: backup.Dockerfile }
    image: kebo-desk-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: kebo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kebo
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_FILES_KEEP: ${BACKUP_FILES_KEEP:-2}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_GID: ${BACKUP_GID:-10560}
      TZ: ${APP_TIME_ZONE:-Asia/Shanghai}
      # The app's files, read through MinIO for the off-site sync.
      FILES_S3_ENDPOINT: http://minio:9000
      FILES_S3_BUCKET: ${S3_BUCKET:-kebo-files}
      FILES_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kebo}
      FILES_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Off-site copy to an S3 store of your own (docs/restore.md); off while OFFSITE_S3_ENDPOINT is empty.
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:-}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-us-east-1}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-kebo-desk}
      OFFSITE_ENCRYPTION_PASSWORD: ${OFFSITE_ENCRYPTION_PASSWORD:-}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-30}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - files:/data/files:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
  files:
