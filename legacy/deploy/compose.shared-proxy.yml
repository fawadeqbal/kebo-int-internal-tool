# Add-on for a server whose existing Caddy runs in Docker on a shared network
# (on 145.241.156.60: container "global-caddy", network "global-proxy").
# Only the app joins that network, under the unique name "kebo-rfq-app";
# the database, file storage and worker stay on the private kebo-rfq network.
# install.sh sets COMPOSE_FILE so plain "docker compose" always includes this file.
services:
  app:
    container_name: kebo-rfq-app
    networks:
      default: {}
      proxy:
        aliases: [kebo-rfq-app]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-global-proxy}
