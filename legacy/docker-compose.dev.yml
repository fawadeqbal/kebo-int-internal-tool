# Development: only the database runs in Docker; the app runs with `npm run dev`.
# Connect with DATABASE_URL=postgres://qms:qms@localhost:5433/qms
#   docker compose -f docker-compose.dev.yml up -d
name: qms-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    ports:
      # 5433 on your PC, so it never clashes with another PostgreSQL already using 5432
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
  # MinIO for uploaded files: API on localhost:9000
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: kebo
      MINIO_ROOT_PASSWORD: kebo-dev-password
    ports:
      - "9000:9000"
    volumes:
      - files-dev:/data
volumes:
  pgdata-dev:
  files-dev:
