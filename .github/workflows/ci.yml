name: CI

on:
  push:
    branches: [main, "revamp/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kebo
          POSTGRES_USER: kebo
          POSTGRES_PASSWORD: kebo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kebo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kebo:kebo@localhost:5432/kebo
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - name: Migrations apply cleanly and the demo seed runs
        run: pnpm db:deploy && pnpm db:seed --demo
      # A difference here is what `prisma migrate dev` would write as a migration on a developer's machine.
      - name: The schema file says what the migrations made (no drift)
        run: pnpm db:check-drift
      - name: The ledger posts the demo and agrees with its figures
        run: |
          node apps/api/dist/cli/ledger.js rebuild --all --dry-run
          node apps/api/dist/cli/ledger.js rebuild --all
          node apps/api/dist/cli/ledger.js rebuild --all
          node apps/api/dist/cli/ledger.js check --all
      # COVERAGE=1: each package's tests also measure how much of its src/ they run, and fail under its floor.
      - run: pnpm turbo run typecheck lint test
        env:
          COVERAGE: "1"
      - name: Test coverage, on the summary page
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  # The app in a real browser (apps/web-e2e), on the demo data: sign in, a new inquiry and a payment received the
  # way a person does them, then every page at laptop and phone width checked for errors, sideways scrolling and
  # WCAG 2.2 AA (axe). Playwright starts the API, the web app and a stand-in for Caddy; Chrome is on the runner.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kebo
          POSTGRES_USER: kebo
          POSTGRES_PASSWORD: kebo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kebo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kebo:kebo@localhost:5432/kebo
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@kebo/api... --filter=@kebo/web...
      - name: The demo data
        run: |
          pnpm db:deploy && pnpm db:seed --demo
          node apps/api/dist/cli/ledger.js rebuild --all
      - name: The checks in a browser
        run: pnpm --filter @kebo/web-e2e e2e
      - name: What the browser found, on the summary page
        if: always()
        run: node apps/web-e2e/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: The report, with a trace of each failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            apps/web-e2e/playwright-report
            apps/web-e2e/test-results
          retention-days: 14

  # The migrations on a database with data in it, as in production: the base (main, or the
  # previous commit on a push) is migrated and seeded with its own code, then this change's
  # migrations run on it, then the API tests.
  upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kebo
          POSTGRES_USER: kebo
          POSTGRES_PASSWORD: kebo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kebo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kebo:kebo@localhost:5432/kebo
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}
      - name: Find the base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "BASE_SHA=$base" >>"$GITHUB_ENV"
          echo "Base: $(git log -1 --format='%h %s' "$base")"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: New migrations come after the base's, with Prisma names
        run: pnpm db:check-migrations "$BASE_SHA"
      - name: The base's code migrates and seeds the database
        run: |
          git checkout -q "$BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@kebo/database...
          pnpm db:deploy && pnpm db:seed --demo
      - name: This change's migrations on that database
        run: |
          git checkout -q "$HEAD_SHA"
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@kebo/api...
          pnpm db:deploy
          pnpm --filter @kebo/database exec prisma migrate status
          pnpm db:seed --demo
          if [ -f apps/api/dist/cli/ledger.js ]; then
            node apps/api/dist/cli/ledger.js rebuild --all
            node apps/api/dist/cli/ledger.js check --all
          fi
      - name: The API tests on the upgraded database
        run: pnpm turbo run test --filter=@kebo/api

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The tests that call a running API are skipped here (no KEBO_API_URL); widget and unit tests run.
      - run: flutter test

  phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/phone
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Colours, type and sizes come from the Kestrel tokens: the Dart must match them.
      - run: dart run tool/gen_tokens.dart --check
      # pubspec version, Android build number and CHANGELOG entry agree.
      - run: dart run tool/version.dart check
      - run: flutter analyze
      - run: flutter test
      # A test APK of this commit (debug-signed), to install and review on a phone.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rfq-desk-test-apk
          path: apps/phone/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  app-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app-v2
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gen/requirements.txt
      # The screens, models and tests come from spec/: they must match it.
      - run: python3 -m gen --check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
