# On a server whose Caddy runs in Docker on a shared network (145.241.156.60: "global-caddy" on "global-proxy").
# Only the web and the API join it, under unique names; the database, files and worker stay private.
#   COMPOSE_FILE=docker-compose.yml:deploy/compose.shared-proxy.yml docker compose up -d
services:
  web:
    container_name: kebo-desk-web
    networks: { default: {}, proxy: { aliases: [kebo-desk-web] } }
  api:
    container_name: kebo-desk-api
    networks: { default: {}, proxy: { aliases: [kebo-desk-api] } }

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-global-proxy}
