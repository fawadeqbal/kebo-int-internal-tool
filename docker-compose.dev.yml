# Development: only the database runs in Docker; the app runs with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: qms-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
volumes:
  pgdata-dev:
