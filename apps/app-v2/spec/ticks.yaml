# What each checklist item asks to be ticked, and where the answer is saved.
#
#   write:   METHOD path. {order} the order, {shipment} its first shipment (made when there is none),
#            {kind} / {step} the part of the key after "doc:" / "bank:".
#   send:    fixed values sent with the answers.
#   fields:  what is asked (same field forms as the entities). Required fields must be filled to tick.
#   prefill: field: where its value starts from: flow.<path> (GET /orders/:id/flow), defaults.<path>
#            (GET /orders/:id/defaults), "today", or "order.<field>".
#   file:    the item takes pages or a photo: { step, as } — uploaded to the order first; as: attachmentId
#            sends its id with the answers, step only files it on the step.
#   hint:    one line under the title saying where the answer goes.
#
# Items not listed here are ticked on the web (the sheet says so). Own items (the company's
# checklist) are handled by their tool: done, fill or upload.
ticks:
  route:
    write: PATCH /api/orders/{order}/route
    hint: How the customer pays. It sets the deposit and balance steps.
    fields:
      route: { enum: PaymentRoute, required: true, label: Route }
      balanceWhen: { enum: BalanceWhen, label: Balance is paid }
      lcTerms: { enum: LcTerms, label: LC terms }
      lcDays: { type: int, label: Days after sight, hint: Deferred LC only }
    prefill: { route: flow.payment.route, balanceWhen: flow.payment.balanceWhen, lcTerms: flow.payment.lcTerms, lcDays: flow.payment.lcDays }

  contract:
    write: PUT /api/orders/{order}/bank-contract
    send: { status: opened }
    hint: Goes on the order and is checked against its total and dates.
    fields:
      number: { type: text, max: 60, label: LC or contract number }
      openedOn: { type: date!, label: Opened on }
      amount: { type: number, label: Amount }
      currency: { enum: Currency }
      latestShipOn: { type: date, label: Latest shipment date }
      expiresOn: { type: date, label: Expires on }
      customerBank: { type: text, max: 160, label: Customer's bank }
      ourBank: { type: text, max: 160, label: Our bank }
    prefill:
      number: flow.payment.bankContract.number
      openedOn: today
      amount: flow.payment.bankContract.amount
      currency: flow.payment.bankContract.currency
      latestShipOn: flow.payment.bankContract.latestShipOn
      expiresOn: flow.payment.bankContract.expiresOn
      customerBank: flow.payment.bankContract.customerBank
      ourBank: flow.payment.bankContract.ourBank

  factory_ordered:
    write: PATCH /api/orders/{order}/factory-order
    fields:
      factoryOrderedOn: { type: date!, label: Ordered on }
      factoryOrderNo: { type: text, max: 60, label: Factory's order number }
    prefill: { factoryOrderedOn: today, factoryOrderNo: flow.factory.orderNo }

  ready_date:
    write: PATCH /api/orders/{order}/details
    hint: The date the factory says the goods are ready.
    fields:
      readyOn: { type: date!, label: Ready on }
    prefill: { readyOn: flow.factory.readyOn }

  booked:
    write: PATCH /api/shipments/{shipment}
    send: { status: booked }
    hint: Goes on Shipment 1.
    fields:
      forwarder: { type: text, max: 120 }
      bookingNo: { type: text, max: 60, label: Booking number }
      etd: { type: date, label: Leaves on (ETD) }
    prefill: { forwarder: [flow.shipping.shipments.0.forwarder, defaults.forwarder.name], bookingNo: flow.shipping.shipments.0.bookingNo, etd: flow.shipping.shipments.0.etd }

  loaded:
    write: PATCH /api/shipments/{shipment}
    send: { status: loaded }
    hint: Goes on Shipment 1 and the packing list.
    fields:
      containerNo: { type: text!, max: 120, label: Container number, upper: true }
      sealNo: { type: text, max: 40, label: Seal number, upper: true }
      loadedOn: { type: date!, label: Loaded on }
    prefill: { containerNo: flow.shipping.shipments.0.containerNo, sealNo: flow.shipping.shipments.0.sealNo, loadedOn: today }
    file: { step: shipping, kind: photo }

  sailed:
    write: PATCH /api/shipments/{shipment}
    send: { status: departed }
    hint: Goes on the shipment, the papers and the bank set.
    fields:
      vessel: { type: text, max: 120 }
      blNo: { type: text!, max: 60, label: B/L number, upper: true }
      departedOn: { type: date!, label: Sailed on }
    prefill: { vessel: flow.shipping.shipments.0.vessel, blNo: flow.shipping.shipments.0.blNo, departedOn: today }
    file: { step: shipping, kind: other }

  arrived:
    write: PATCH /api/shipments/{shipment}
    send: { status: arrived }
    fields:
      arrivedOn: { type: date!, label: Arrived on }
    prefill: { arrivedOn: today }

  shipped:
    write: PATCH /api/orders/{order}/details
    fields:
      shippedOn: { type: date!, label: Shipped on }
      blNo: { type: text, max: 60, label: B/L number, upper: true }
    prefill: { shippedOn: today, blNo: order.blNo }

  doc:*:
    write: POST /api/orders/{order}/document-set
    send: { kind: "{kind}", status: ready }
    hint: Marks the paper ready in the bank set.
    fields:
      number: { type: text, max: 60, label: Number }
      issuedOn: { type: date, label: Issued on }
    prefill: { issuedOn: today }
    file: { step: documents, kind: other, as: attachmentId }

  bank:*:
    write: PUT /api/orders/{order}/bank-steps/{step}
    fields:
      doneOn: { type: date!, label: Done on }
      courier: { type: text, max: 60 }
      reference: { type: text, max: 120, label: Tracking or reference }
      note: { type: text, max: 500 }
    prefill: { doneOn: today }

  delivered:
    write: PATCH /api/orders/{order}/delivery
    fields:
      deliveredOn: { type: date!, label: Delivered on }
      deliveryReceivedBy: { type: text, max: 120, label: Received by }
      deliveryNote: { type: multiline, max: 2000, label: Note, hint: Anything damaged or missing }
    prefill: { deliveredOn: today }
    file: { step: delivery, kind: photo }

  sat_done:
    write: POST /api/orders/{order}/sat/all-passed
    hint: Every SAT check passed and the customer signed.
    fields:
      satDoneOn: { type: date!, label: SAT done on }
      satSignedBy: { type: text, max: 120, label: Signed by }
    prefill: { satDoneOn: today }
    file: { step: delivery, kind: other }

  closed:
    write: POST /api/orders/{order}/stage
    send: { to: done }
    hint: Closes the order. Money still due is asked about first.
    fields:
      note: { type: text, max: 2000 }

# Ticked on the web for now, with the reason shown in the sheet.
web:
  deposit_in: Money received comes to the phone in phase 4.
  balance_in: Money received comes to the phone in phase 4.
  factory_advance: Payments to factories come to the phone in phase 4.
  factory_paid: Payments to factories come to the phone in phase 4.
  claims_closed: Claims are closed on the web.
  bank:bank_paid_us: The bank's payment is recorded as money received on the web.
