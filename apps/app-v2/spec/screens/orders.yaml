screen: Orders
frame: list
entity: Order
path: /orders
tab: Orders
title: Orders
search: Order, customer or product
row:
  title: refNo
  sub: [customer.name, inquiry.title, needs.title]
  badge: stage
  value: { of: due, text: "{} due" }
open: Order

---
screen: Order
frame: record
entity: Order
path: /orders/:id
tab: Orders
header: { title: refNo, sub: [customer.name, inquiry.assignee.name, total], badge: stage }
sections:
  - { title: Where it stands, custom: OrderFlow }  # one row per stage: its word and a line of facts, read from the order's data
  - { title: Goods, custom: OrderLines }      # the first lines, See all, goods received, packing list
  - { title: Money, custom: OrderMoneySection }  # lib/custom/money.dart: the plan, payments and receipts, approvals, factories
  - title: Papers
    custom: OrderPapers        # lib/custom/order_papers.dart: every paper as a PDF, the internal copy too
  - title: Files
    custom: OrderFiles         # lib/custom/order_files.dart: every file of the order
  - title: Details
    fields: [orderedOn, inquiry.refNo, inquiry.assignee.name, incoterm, incotermPlace, portOfDischarge, shipBy, readyOn, shippedOn, blNo]
  - { title: Notes, custom: RecordNotes }             # lib/custom/record_notes.dart: calls, visits and notes
  - { title: Follow-ups, custom: RecordFollowUps }     # lib/custom/record_follow_ups.dart: planned calls and visits
  - { title: Changes, history: order }
more:
  - { label: Note after a call, run: record_notes.addNote, perm: orders.update }
  - { label: New follow-up, run: record_follow_ups.addFollowUp }
  - { label: Factory visit, run: factory_visit.openFactoryVisit, perm: orders.update, when: { status: open } }
  - { label: Delivery & SAT, run: delivery.openDelivery, when: { stage: [shipped, done] } }
