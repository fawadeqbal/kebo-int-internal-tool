screen: Orders
frame: list
entity: Order
path: /orders
tab: Orders
title: Orders
search: Order, customer or product
row:
  title: refNo
  sub: [customer.name, inquiry.title, needs.title]
  badge: stage
  value: { of: due, text: "{} due" }
open: Order

---
screen: Order
frame: record
entity: Order
path: /orders/:id
tab: Orders
header: { title: refNo, sub: [customer.name, inquiry.title, stage] }
sections:
  - title: Money
    fields: [money.total, money.charged, money.received, money.bankCharges, money.due]
  - title: Next
    fields: [needs.title, needs.due, next.label, next.hint]
  - title: Papers
    custom: OrderPapers        # lib/custom/order_papers.dart: every paper as a PDF, the internal copy too
  - title: Files
    custom: OrderFiles         # lib/custom/order_files.dart: every file of the order
  - title: Details
    fields: [orderedOn, inquiry.refNo, inquiry.assignee.name, incoterm, incotermPlace, portOfDischarge, shipBy, readyOn, shippedOn, blNo]
