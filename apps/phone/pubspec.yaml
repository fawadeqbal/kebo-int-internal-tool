name: rfq_desk
description: "RFQ Desk on the phone, built on the Kestrel design system."
publish_to: 'none'

version: 3.0.0-beta.1+3000031
environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_svg: ^2.4.0
  package_info_plus: ^10.2.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  timezone: ^0.11.2
  intl: ^0.20.3
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  file_picker: ^13.2.0
  pdfrx: 2.6.5
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
