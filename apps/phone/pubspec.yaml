name: rfq_desk
description: "RFQ Desk on the phone, built on the Kestrel design system."
publish_to: 'none'

version: 3.0.0-alpha.2+3000002
environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_svg: ^2.4.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
